# ============================================
# AI EV Charging – Entity Configuration
# ============================================
# Fyll i dina entitets-IDs nedan.
# Hitta dem i HA → Developer Tools → States
# ============================================

# --- Laddbox ---
charger:
  status: sensor.a1_status                          # Laddboxens status (disconnected/awaiting_start/charging)
  switch: switch.a1_laddboxen_aktiverad             # ON/OFF-kontroll
  power: sensor.a1_effekt                           # Aktuell laddeffekt (kW)
  session_energy: sensor.a1_energi_laddningssession # Energi denna session (kWh)
  monthly_cost: sensor.a1_kostnad_denna_manad       # Kostnad denna månad (kr)
  max_current: 12                                   # Max ampere (beror på säkring)
  serial_number: "XXXXXXX"                          # Easee serienummer (för API-anrop)
  # Service för dynamisk ström:
  # easee.set_circuit_dynamic_limit / easee.set_charger_dynamic_limit

# --- Elbil 1 (uppkopplad) ---
car_primary:
  name: "VW ID"
  battery_capacity_kwh: 52
  soc: sensor.wv2zzzeb9rh001501_battery_level                     # Batterinivå (%)
  range: sensor.wv2zzzeb9rh001501_electric_range                   # Räckvidd (km)
  cable_connected: binary_sensor.wv2zzzeb9rh001501_charging_cable_connected
  position: device_tracker.wv2zzzeb9rh001501_position              # home / not_home
  charging_state: sensor.wv2zzzeb9rh001501_charging_state

# --- Elbil 2 (ej uppkopplad, valfri) ---
car_secondary:
  name: "Renault Zoe"
  battery_capacity_kwh: 52
  soc_manual: input_number.zoe_manuell_batteriniva  # Manuell SoC-helper
  # Identifiering: om car_primary.cable_connected = off
  # och charger.status = awaiting_start → det är denna bil

# --- Elpris ---
energy:
  price: sensor.nordpool_kwh_se3_sek_2_10_025       # Nordpool aktuellt pris (kr/kWh)
  cheap_electricity: binary_sensor.billig_el        # Binär: billigt pris
  cheap_electricity_2: binary_sensor.billig_el_2    # Eventuell andra tröskel

# --- Solpaneler ---
solar:
  current_power: sensor.solaredge_aktuell_effekt    # Produktion just nu (W)
  daily_energy: sensor.solaredge_el_i_dag           # Dagens produktion (Wh)
  solar_charging: binary_sensor.solladdning         # Binär: tillräckligt överskott

# --- Lastbalansering ---
load_balancing:
  phase_load: sensor.huset_max_fasbelastning        # Högsta fasström (A)
  pool_heater: switch.poolvarme_ovrigt_2            # Poolvärme ON/OFF

# --- Hjälpsensorer ---
helpers:
  force_charge: input_boolean.laddning_force        # Manuell tvångsladdning
  deadline_charging: binary_sensor.deadline_laddning

# --- Notifieringar ---
notifications:
  - notify.mobile_app_dennis_iphone2
  - notify.mobile_app_linnea_iphone
  # Lägg till fler mottagare här

# --- Tröskelvärden ---
thresholds:
  cheap_price_kwh: 1.00          # Ladda under detta pris
  medium_price_kwh: 2.00         # Ladda bara med sol/låg SoC
  emergency_soc_percent: 15      # Nödladda oavsett pris
  fuse_limit_high_amps: 24.5     # Stäng av vid hög last
  fuse_limit_low_amps: 20.0      # Återställ (hysteres)
  fuse_delay_off_seconds: 45     # Vänta ut startpikar
  fuse_delay_on_minutes: 5       # Vänta före återställning
  solar_min_watts: 2000          # Minimum sol för laddning
  solar_high_watts: 2500         # Hög sol-trigger

# --- AI ---
ai:
  provider: mistral               # mistral / openai / anthropic
  model: mistral-small-latest
  schedule: "0 * * * *"           # Varje hel timme (cron)
