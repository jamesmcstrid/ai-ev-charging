alias: "Elbil: Smart laddning"
description: >-
  Laddar vid billigt pris, solproduktion, deadline-behov, nödladdning (<15%),
  eller tvångsladdning. Anpassa entity-IDs till din installation.
mode: restart
triggers:
  - trigger: state
    entity_id: binary_sensor.billig_el            # Nordpool priströskel
  - trigger: state
    entity_id: binary_sensor.deadline_laddning     # Deadline-sensor
  - trigger: state
    entity_id: binary_sensor.solladdning           # Sol-överskott
  - trigger: state
    entity_id: sensor.a1_status                    # Easee laddbox status
  - trigger: state
    entity_id: binary_sensor.wv2zzzeb9rh001501_charging_cable_connected  # VW kabel
  - trigger: state
    entity_id: input_boolean.laddning_force        # Manuell tvångsladdning
  - trigger: numeric_state
    entity_id: sensor.wv2zzzeb9rh001501_battery_level  # VW SoC
    below: 16
  - trigger: state
    entity_id: input_number.zoe_manuell_batteriniva    # Zoe manuell SoC
  - trigger: numeric_state
    entity_id: sensor.solaredge_aktuell_effekt         # Sol hög
    above: 2500
  - trigger: numeric_state
    entity_id: sensor.solaredge_aktuell_effekt         # Sol låg
    below: 2000
  - trigger: time_pattern
    minutes: /15                                       # Var 15:e minut
conditions:
  - condition: not
    conditions:
      - condition: state
        entity_id: sensor.a1_status
        state: disconnected
actions:
  - choose:
      # LADDA om minst ETT villkor är sant
      - conditions:
          - or:
              - condition: state
                entity_id: input_boolean.laddning_force
                state: "on"
              - condition: state
                entity_id: binary_sensor.billig_el
                state: "on"
              - condition: state
                entity_id: binary_sensor.deadline_laddning
                state: "on"
              - condition: state
                entity_id: binary_sensor.solladdning
                state: "on"
              - condition: numeric_state
                entity_id: sensor.wv2zzzeb9rh001501_battery_level
                below: 15
              - condition: and
                conditions:
                  - condition: numeric_state
                    entity_id: input_number.zoe_manuell_batteriniva
                    below: 15
                  - condition: state
                    entity_id: binary_sensor.wv2zzzeb9rh001501_charging_cable_connected
                    state: "off"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.a1_laddboxen_aktiverad
      # STOPPA om ALLA villkor är falska
      - conditions:
          - condition: state
            entity_id: input_boolean.laddning_force
            state: "off"
          - condition: state
            entity_id: binary_sensor.billig_el
            state: "off"
          - condition: state
            entity_id: binary_sensor.deadline_laddning
            state: "off"
          - condition: state
            entity_id: binary_sensor.solladdning
            state: "off"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.a1_laddboxen_aktiverad
