alias: "Säkerhet: Återställ efter hög last"
description: >-
  Slår på poolvärme igen när lasten varit låg i 5 min.
  Laddning återställs bara om elpriset är billigt.
triggers:
  - trigger: numeric_state
    entity_id: sensor.huset_max_fasbelastning  # Easee Equalizer / CT-klämma
    below: 20                                   # Hysteres: 4.5A under avstängningströskeln
    for: "00:05:00"                             # Väntar 5 min innan återställning
actions:
  # 1. Återställ poolvärme
  - action: switch.turn_on
    target:
      entity_id: switch.poolvarme_ovrigt_2
  # 2. Återställ laddning BARA om billig el
  - if:
      - condition: state
        entity_id: binary_sensor.billig_el
        state: "on"
    then:
      - action: switch.turn_on
        target:
          entity_id: switch.a1_laddboxen_aktiverad
  # 3. Notifiera
  - action: notify.mobile_app_dennis_iphone2   # Ändra till din notify-tjänst
    data:
      title: ✅ Last normaliserad
      message: Lasten har varit under 20A i 5 min. Poolvärme återställd.
  - action: notify.mobile_app_linnea_iphone    # Ta bort eller ändra
    data:
      title: ✅ Last normaliserad
      message: Lasten har varit under 20A i 5 min. Poolvärme återställd.
